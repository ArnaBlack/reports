<svg xmlns="http://www.w3.org/2000/svg" width="904" height="190" viewBox="0 0 904 190">
<title>Координаты HTML-блока на canvas</title>
<desc>Без трансформаций отсчёт идёт от верхнего левого угла canvas. Точка 110, 140 задаёт верхний левый угол всего блока, включая внутренние отступы. Схема не в масштабе.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#a9dad0"/></marker></defs>
<rect x=".5" y=".5" width="903" height="189" rx="14" fill="#091815" stroke="#3b504a"/>
<g font-family="PT Sans, Arial, sans-serif" font-size="17" fill="#edf5f2">
<path d="M54 28H545" fill="none" stroke="#a9dad0" marker-end="url(#arrow)"/>
<path d="M54 28V169" fill="none" stroke="#a9dad0" marker-end="url(#arrow)"/>
<circle cx="54" cy="28" r="4" fill="#7df5d1"/>
<text x="14" y="20">0, 0</text><text x="554" y="34">X →</text><text x="22" y="173">Y</text>
<path d="M153 28V80M54 80H153" fill="none" stroke="#a9dad0" stroke-dasharray="4 5"/>
<text x="92" y="49" fill="#a9dad0">110</text><text x="65" y="72" fill="#a9dad0">140</text>
<rect x="153" y="80" width="374" height="88" rx="0" fill="#15352e" stroke="#7df5d1" stroke-dasharray="5 4"/>
<text x="173" y="117" font-size="28" font-weight="700" fill="#ffffff">Встречаемся</text>
<text x="173" y="149" font-size="28" font-weight="700" fill="#7df5d1">в браузере</text>
<circle cx="153" cy="80" r="4" fill="#ffcca5"/>
<text x="604" y="51">Отсчёт — от верхнего левого угла</text>
<text x="604" y="77">X — вправо, Y — вниз</text>
<text x="604" y="120" fill="#ffcca5">110, 140 — верхний левый</text>
<text x="604" y="146" fill="#ffcca5">угол HTML-блока</text>
</g></svg>